    <path d="M400,220 C420,180 460,150 490,130 C470,160 450,190 440,220 C470,200 510,180 540,170 C510,195 470,225 450,250 C500,240 550,230 600,230 C550,260 490,280 440,300 C480,310 520,330 550,360 C500,350 450,330 420,310 C430,350 440,400 450,460 C420,420 405,370 400,320 C395,370 380,420 350,460 C360,400 370,350 380,310 C350,330 300,350 250,360 C280,330 320,310 360,300 C310,280 250,260 200,230 C250,230 300,240 350,250 C330,225 290,195 260,170 C290,180 330,200 360,220 C350,190 330,160 310,130 C340,150 380,180 400,220 Z" />
    
