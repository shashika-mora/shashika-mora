<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" stroke="#6f0909" stroke-width="2" opacity="0.7"/>
  <circle cx="100" cy="100" r="90" stroke="#c79a45" stroke-width="0.5" opacity="0.4"/>

  <!-- Scale pattern ring segments -->
  <path d="M100 10 A90 90 0 0 1 190 100" stroke="#6f0909" stroke-width="1" opacity="0.3"/>
  <path d="M190 100 A90 90 0 0 1 100 190" stroke="#6f0909" stroke-width="1" opacity="0.3"/>
  <path d="M100 190 A90 90 0 0 1 10 100" stroke="#6f0909" stroke-width="1" opacity="0.3"/>
  <path d="M10 100 A90 90 0 0 1 100 10" stroke="#6f0909" stroke-width="1" opacity="0.3"/>

  <!-- Centre medallion fill -->
  <circle cx="100" cy="100" r="78" fill="#0a0705"/>

  <!-- Three-headed dragon silhouette (original, simplified) -->
  <!-- Central dragon head -->
  <g fill="#a31313">
    <!-- Main body / torso -->
    <ellipse cx="100" cy="118" rx="14" ry="20" opacity="0.9"/>
    <!-- Wings -->
    <path d="M86 108 Q60 88 52 70 Q64 80 80 96 Z" opacity="0.85"/>
    <path d="M114 108 Q140 88 148 70 Q136 80 120 96 Z" opacity="0.85"/>

    <!-- Central neck and head -->
    <rect x="94" y="86" width="12" height="22" rx="4"/>
    <ellipse cx="100" cy="80" rx="10" ry="12"/>
    <!-- Central crown/horns -->
    <polygon points="93,72 96,58 100,70" opacity="0.9"/>
    <polygon points="107,72 104,58 100,70" opacity="0.9"/>
    <polygon points="100,68 100,54 104,66" opacity="0.8"/>

    <!-- Left head (on neck extending left) -->
    <path d="M88 102 Q74 92 68 84 Q72 86 76 90 L84 100 Z"/>
    <ellipse cx="68" cy="80" rx="9" ry="11" transform="rotate(-15 68 80)"/>
    <!-- Left horns -->
    <polygon points="63,73 62,60 68,71" transform="rotate(-15 65 67)" opacity="0.9"/>
    <polygon points="73,71 74,58 68,69" transform="rotate(-15 71 65)" opacity="0.8"/>

    <!-- Right head (on neck extending right) -->
    <path d="M112 102 Q126 92 132 84 Q128 86 124 90 L116 100 Z"/>
    <ellipse cx="132" cy="80" rx="9" ry="11" transform="rotate(15 132 80)"/>
    <!-- Right horns -->
    <polygon points="127,73 126,60 132,71" transform="rotate(15 129 67)" opacity="0.9"/>
    <polygon points="137,71 138,58 132,69" transform="rotate(15 135 65)" opacity="0.8"/>

    <!-- Tail -->
    <path d="M100 138 Q92 148 88 158 Q96 150 104 140 Z" opacity="0.7"/>
    <!-- Wing membrane details -->
    <path d="M80 96 Q68 86 58 74" stroke="#c79a45" stroke-width="0.5" opacity="0.4" fill="none"/>
    <path d="M120 96 Q132 86 142 74" stroke="#c79a45" stroke-width="0.5" opacity="0.4" fill="none"/>
  </g>

  <!-- Eye glints -->
  <circle cx="97" cy="79" r="1.5" fill="#ff5a13" opacity="0.9"/>
  <circle cx="103" cy="79" r="1.5" fill="#ff5a13" opacity="0.9"/>
  <circle cx="65" cy="79" r="1.2" fill="#ff5a13" opacity="0.8"/>
  <circle cx="135" cy="79" r="1.2" fill="#ff5a13" opacity="0.8"/>

  <!-- Gold accent ring details -->
  <circle cx="100" cy="100" r="78" stroke="#c79a45" stroke-width="0.5" fill="none" opacity="0.25"/>
</svg>
