<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#142136" />
      <stop offset="60%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="termHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#101826" />
    </linearGradient>
    <linearGradient id="limeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ff68" />
      <stop offset="100%" stop-color="#a6e22e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#bgGlow)" />

  <!-- Subtle Celestial Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Ambient WiFi Radiating Waves in Background -->
  <g fill="none" stroke="rgba(199,244,74,0.06)" stroke-width="1.5">
    <circle cx="400" cy="80" r="160" />
    <circle cx="400" cy="80" r="240" />
    <circle cx="400" cy="80" r="320" />
  </g>

  <!-- Terminal Window Container -->
  <g filter="url(#shadow)" transform="translate(60, 45)">
    <!-- Terminal Body -->
    <rect width="680" height="410" rx="12" fill="#090d16" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

    <!-- Terminal Header Bar -->
    <path d="M0,12 Q0,0 12,0 L668,0 Q680,0 680,12 L680,38 L0,38 Z" fill="url(#termHeader)" />
    <line x1="0" y1="38" x2="680" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Window Control Buttons -->
    <circle cx="24" cy="19" r="6" fill="#ff5f56" />
    <circle cx="44" cy="19" r="6" fill="#ffbd2e" />
    <circle cx="64" cy="19" r="6" fill="#27c93f" />

    <!-- Window Title -->
    <text x="340" y="24" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#9da9bf" letter-spacing="0.5">
      Administrator: Command Prompt — show_wifi.cmd
    </text>

    <!-- Terminal Content Area -->
    <g transform="translate(28, 64)" font-family="'Consolas', 'Cascadia Code', monospace" font-size="13" line-height="1.5">
      <!-- Command prompt -->
      <text x="0" y="16" fill="#9da9bf">
        <tspan fill="#c7f44a">C:\Tools\wife-passwords&gt;</tspan> show_wifi.cmd
      </text>

      <!-- Banner Box -->
      <text x="0" y="44" fill="#586e8e">========================================================</text>
      <text x="0" y="66" fill="#e2ecfc" font-weight="bold">
        wife-passwords <tspan fill="#9da9bf" font-weight="normal">— Windows Wi-Fi Profile and Key Viewer</tspan>
      </text>
      <text x="0" y="88" fill="#586e8e">========================================================</text>

      <!-- Status notice -->
      <text x="0" y="118" fill="#c7f44a">
        <tspan fill="#a6e22e">[*] Session:</tspan> Elevated Administrator privileges active
      </text>
      <text x="0" y="138" fill="#9da9bf">
        <tspan fill="#a6e22e">[*] Interface:</tspan> Native netsh wlan service query
      </text>

      <!-- Enumerate Output -->
      <text x="0" y="172" fill="#e2ecfc">
        Fetching details for profile <tspan fill="#c7f44a">"Campus_HighSpeed_5G"</tspan>:
      </text>
      <text x="0" y="196" fill="#788ca6">--------------------------------------------------------</text>
      
      <!-- Key attributes -->
      <text x="16" y="220" fill="#9da9bf">SSID Name          : <tspan fill="#ffffff">Campus_HighSpeed_5G</tspan></text>
      <text x="16" y="244" fill="#9da9bf">Network Type       : <tspan fill="#ffffff">Infrastructure</tspan></text>
      <text x="16" y="268" fill="#9da9bf">Authentication     : <tspan fill="#ffffff">WPA2-Personal</tspan></text>
      <text x="16" y="292" fill="#9da9bf">Cipher             : <tspan fill="#ffffff">CCMP / AES</tspan></text>
      <text x="16" y="316" fill="#9da9bf">Security Key       : <tspan fill="#c7f44a" font-weight="bold">Present (Cleartext)</tspan></text>

      <!-- Prompt cursor -->
      <text x="0" y="348" fill="#c7f44a">
        Enter profile number to view, [B] Back, [E] Exit: <tspan fill="#ffffff">_</tspan>
      </text>
    </g>
  </g>
</svg>
